<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#5a4fc0">
  <title>Not found · Iris 35</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="/iris-glass.css">
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{min-height:100vh;display:flex;flex-direction:column;color:var(--text)}
    header{padding:20px}
    .home-mark{display:inline-flex;align-items:center;gap:10px;color:var(--muted);text-decoration:none;font-size:12px;letter-spacing:.18em;text-transform:uppercase}
    .home-mark img{width:36px;height:36px;border-radius:9px;display:block}
    main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px 20px 64px}
    .code{font-size:12px;letter-spacing:.3em;color:var(--muted);margin-bottom:12px}
    h1{font-size:clamp(1.6rem,6vw,2.4rem);font-weight:600;line-height:1.2;margin-bottom:24px;max-width:22ch}
    .home{display:inline-block;padding:11px 20px;border-radius:999px;border:1px solid var(--line-2);background:var(--card);color:var(--text);text-decoration:none;font-weight:600}
    .home:hover,.home:focus-visible{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
    footer{padding:20px;text-align:center;font-size:13px;color:var(--muted)}
    footer a{color:var(--gold-2)}
  </style>
</head>
<body>
  <header><a class="home-mark" href="/"><img src="/favicon.svg" alt="" width="36" height="36"><span>Iris 35</span></a></header>
  <main>
    <p class="code">404</p>
    <h1>That path is not here.</h1>
    <a class="home" href="/">Back to Iris 35</a>
  </main>
  <footer><span>elghaly, LLC</span> · <a href="mailto:support@elghaly.dev">support@elghaly.dev</a></footer>
</body>
</html>
